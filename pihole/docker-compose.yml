name: pihole

services:
  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    restart: unless-stopped
    pull_policy: always
    # Rete dell'host: Pi-hole deve ascoltare la porta 53, e in host mode
    # le porte non si mappano. L'interfaccia web sta su WEBUI_PORT_PIHOLE.
    network_mode: host
    environment:
      TZ: ${TIMEZONE:?err}
      FTLCONF_webserver_api_password: ${PIHOLE_PASSWORD:?err}
      FTLCONF_webserver_port: ${WEBUI_PORT_PIHOLE:?err}
      # Valori forzati: prevalgono sul pihole.toml copiato da una vecchia
      # installazione. Il modem non deve mai essere un DNS a monte di
      # Pi-hole, altrimenti modem e Pi-hole si rimandano le query in loop.
      FTLCONF_dns_upstreams: 1.1.1.1;9.9.9.9
      FTLCONF_dns_revServers: ""
      FTLCONF_dns_listeningMode: local
      FTLCONF_dhcp_active: "false"
    volumes:
      - ${FOLDER_FOR_CONFIGS:?err}/pihole:/etc/pihole
    cap_add:
      - NET_ADMIN
      - SYS_TIME
