name: homepage

services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    pull_policy: always
    ports:
      - "${WEBUI_PORT_HOMEPAGE:?err}:3000"
    volumes:
      - ${FOLDER_FOR_CONFIGS:?err}/homepage:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${FOLDER_FOR_HDD:?err}:/hdd
    environment:
      HOMEPAGE_ALLOWED_HOSTS: ${HOMEPAGE_ALLOWED_HOSTS:?err}
      HOMEPAGE_VAR_JELLYFIN_KEY: ${HOMEPAGE_VAR_JELLYFIN_KEY:?err}
      HOMEPAGE_VAR_SEERR_KEY: ${HOMEPAGE_VAR_SEERR_KEY:?err}
      HOMEPAGE_VAR_RADARR_KEY: ${HOMEPAGE_VAR_RADARR_KEY:?err}
      HOMEPAGE_VAR_SONARR_KEY: ${HOMEPAGE_VAR_SONARR_KEY:?err}
      HOMEPAGE_VAR_PROWLARR_KEY: ${HOMEPAGE_VAR_PROWLARR_KEY:?err}
      HOMEPAGE_VAR_QBITTORRENT_USER: ${HOMEPAGE_VAR_QBITTORRENT_USER:?err}
      HOMEPAGE_VAR_QBITTORRENT_PASSWORD: ${HOMEPAGE_VAR_QBITTORRENT_PASSWORD:?err}
      HOMEPAGE_VAR_GLUETUN_KEY: ${HOMEPAGE_VAR_GLUETUN_KEY:?err}
      HOMEPAGE_VAR_PIHOLE_KEY: ${HOMEPAGE_VAR_PIHOLE_KEY:?err}
      HOMEPAGE_VAR_NEXTCLOUD_URL: ${HOMEPAGE_VAR_NEXTCLOUD_URL:?err}
      HOMEPAGE_VAR_NEXTCLOUD_TOKEN: ${HOMEPAGE_VAR_NEXTCLOUD_TOKEN:?err}
      HOMEPAGE_VAR_SYNCTHING_KEY: ${HOMEPAGE_VAR_SYNCTHING_KEY:?err}
      HOMEPAGE_VAR_PORTAINER_ENV: ${HOMEPAGE_VAR_PORTAINER_ENV:?err}
      HOMEPAGE_VAR_PORTAINER_KEY: ${HOMEPAGE_VAR_PORTAINER_KEY:?err}
      HOMEPAGE_VAR_GITEA_KEY: ${HOMEPAGE_VAR_GITEA_KEY:?err}
